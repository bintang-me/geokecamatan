<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <title>Cari Kecamatan</title>
  <!-- Latar navy -->
  <rect width="64" height="64" rx="14" fill="#0F1D35"/>
  <!-- Ring globe (dipertahankan dari logo lama, lebih tebal agar tajam di 16 px) -->
  <circle cx="32" cy="34" r="19" fill="none" stroke="#EEA201" stroke-width="4.5"/>
  <!-- Pin peta, sedikit menembus ring; outline navy memberi celah dengan ring -->
  <path d="M32 48 C27 41 19.5 34.5 19.5 25 A12.5 12.5 0 0 1 44.5 25 C44.5 34.5 37 41 32 48 Z"
        fill="#EEA201" stroke="#0F1D35" stroke-width="4" paint-order="stroke"/>
  <!-- Lubang pin berbentuk poligon batas wilayah (kecamatan) -->
  <path d="M26.5 22.5 L31 19 L37 20.8 L38.5 25.8 L34.8 30.2 L28 29.3 Z" fill="#0F1D35"/>
</svg>
